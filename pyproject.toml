[project]
name = "skim"
version = "1.0.0"
description = "Skim - an adaptive, task-relevance-driven agent for question answering over long lecture videos."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Skim" }]
keywords = ["agent", "video-qa", "vlm", "long-video", "rag", "deepseek"]

dependencies = [
    # --- LLM / VLM access ---
    "openai>=1.60",
    "httpx>=0.27",
    "tenacity>=8.2",
    # --- config / validation ---
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    # --- media ---
    "pillow>=10.3",
    "imageio-ffmpeg>=0.5",
    "numpy>=1.26",
    # --- remote video sources (Bilibili / YouTube / ...) ---
    "yt-dlp>=2024.8.6",
    # --- ASR ---
    "faster-whisper>=1.1",
    # --- retrieval ---
    "rank-bm25>=0.2.2",
    "jieba>=0.42.1",
    # --- CLI / UI ---
    "typer>=0.12",
    "rich>=13.7",
    "gradio>=4.44",
]

[project.scripts]
skim = "skim.cli:app"

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-cov>=5.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Network tests hit the live VLM and are opt-in: `uv run pytest -m network`.
addopts = "-q -m 'not network'"
markers = ["network: tests that require live LLM API access"]

[tool.uv]
package = true